apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: cloud-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: asia-south1-docker.pkg.dev/cloud-order-platform/cloud-order-repo/config-server:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888