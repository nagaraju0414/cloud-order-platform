apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: cloud-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: asia-south1-docker.pkg.dev/cloud-order-platform/cloud-order-repo/inventory-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888
          envFrom:
            - configMapRef:
                name: cloud-order-config