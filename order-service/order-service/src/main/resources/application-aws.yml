spring:
  application:
    name: order-service

server:
  port: 8081

aws:
  region: ${AWS_REGION:ap-south-1}

dynamodb:
  table-name: ${DYNAMODB_TABLE_NAME:cloud-order}
  endpoint: http://localhost:8000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true